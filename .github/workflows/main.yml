name: Build with CMake and Ninja

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup LLVM (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          wget https://github.com/mstorsjo/llvm-mingw/releases/download/20230614/llvm-mingw-20230614-ucrt-ubuntu-20.04-x86_64.tar.xz
          tar xf llvm-mingw-20230614-ucrt-ubuntu-20.04-x86_64.tar.xz
          echo "$(pwd)/llvm-mingw-20230614-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH

      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install ninja-build xorg-dev libglu1-mesa-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libxxf86vm-dev

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Create Build Directory
        run: mkdir build

      - name: Run CMake
        run: |
          cd build
          cmake .. -GNinja

      - name: Run Ninja
        run: |
          cd build
          ninja

      - name: Create Zip File (Windows)
        run: |
          cd build
          powershell Compress-Archive -Path bin/* -DestinationPath flip_geodesics-windows.zip
        if: runner.os == 'Windows'

      - name: Create Zip File (Linux)
        run: |
          cd build
          zip -r flip_geodesics-linux.zip bin/
        if: runner.os == 'Linux'

      - name: Create Zip File (macOS)
        run: |
          cd build
          zip -r flip_geodesics-macos.zip bin/
        if: runner.os == 'macOS'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-bin-${{ runner.os }}
          path: build/flip_geodesics-*.zip

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          # One release-asset filename per OS (flip_geodesics-<os>.zip) --
          # all three matrix jobs previously uploaded a file literally
          # named "bin.zip" to the SAME release, silently clobbering each
          # other so only one platform's binary actually survived
          # (confirmed on the v0.1.0 release: 3/3 jobs reported success,
          # but only one "bin.zip" asset existed afterward).
          files: build/flip_geodesics-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
